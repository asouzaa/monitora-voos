name: Monitorar voos e publicar painel

on:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: "23 */6 * * *"
      timezone: "America/Belem"
  workflow_dispatch:

concurrency:
  group: monitoramento-voos
  cancel-in-progress: false

jobs:
  monitorar-e-publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v6

      - name: Preparar o Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar o monitor
        run: python -m pip install .

      - name: Consultar preços
        continue-on-error: true
        run: python -m monitora_voo executar --planilha docs/monitoramento_voos.xlsx

      - name: Atualizar dados do painel
        run: python -m monitora_voo exportar --planilha docs/monitoramento_voos.xlsx --saida docs/dados.json

      - name: Salvar histórico no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dados.json docs/monitoramento_voos.xlsx
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza monitoramento de voos"
            git push
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos do painel
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Publicar painel
        id: publicacao
        uses: actions/deploy-pages@v4
